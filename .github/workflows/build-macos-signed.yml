name: Build macOS (self-signed)

# Triggers automatically on every push to nightly, or manually for any ref.
on:
  push:
    branches:
      - nightly
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (e.g. feat/my-branch)"
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15   # Apple Silicon (arm64), ships Xcode 16 / Swift 6
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select latest Xcode (native packages need Swift 6)
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          swift --version

      - name: Compute artifact name
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "ARTIFACT_NAME=SuperCmd-macos-nightly-$SHORT_SHA" >> "$GITHUB_ENV"
          else
            SAFE_REF="$(printf '%s' "$REF" | tr '/ :*?"<>|\\' '-')"
            echo "ARTIFACT_NAME=SuperCmd-macos-$SAFE_REF" >> "$GITHUB_ENV"
          fi

      - name: Import self-signed code-signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERT_PASSWORD" -A -T /usr/bin/codesign
          # Allow codesign to use the key non-interactively in CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Keep both the build keychain and the login keychain in the search list.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # electron-builder only accepts a "valid" (trusted) identity — raw
          # codesign doesn't, but app-builder-lib filters with `find-identity -v`.
          # Trust this self-signed cert for code signing on this ephemeral runner.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys \
            -passin pass:"$MAC_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "--- valid code-signing identities (must be >= 1) ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and package DMG
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --mac dmg \
            --publish never \
            -c.mac.identity="Chief Local Dev" \
            -c.mac.notarize=false \
            -c.mac.hardenedRuntime=false

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/*.dmg
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 14 || 30 }}
